<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Santa María</title>
    <link rel="stylesheet" href="https://unpkg.com">
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
    <script src="https://unpkg.com"></script>
</head>
<body style="margin: 0; padding: 0;">
    <div id="sanity"></div>

    <script>
        const { defineConfig, renderStudio } = Sanity;

        const platilloSchema = {
            name: 'platillo',
            title: 'Menú del Restaurante',
            type: 'document',
            fields: [
                { name: 'nombre', title: 'Nombre del Platillo', type: 'string' },
                { name: 'precio', title: 'Precio ($)', type: 'number' },
                { name: 'descripcion', title: 'Descripción / Ingredientes', type: 'text' },
                { 
                    name: 'categoria', 
                    title: 'Categoría', 
                    type: 'string',
                    options: {
                        list: [
                            { title: 'Entradas', value: 'entradas' },
                            { title: 'Platos Fuertes', value: 'fuertes' },
                            { title: 'Bebidas', value: 'bebidas' }
                        ]
                    }
                },
                { name: 'disponible', title: '¿Está disponible?', type: 'boolean', initialValue: true }
            ]
        };

        const config = defineConfig({
            projectId: 'rfla6gfn',
            dataset: 'production',
            title: 'Administración Santa María',
            schema: {
                types: [platilloSchema]
            }
        });

        renderStudio(document.getElementById('sanity'), config);
    </script>
</body>
</html>
